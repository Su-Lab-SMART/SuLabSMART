name: Validate website
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true
      - name: Build with GitHub Pages subpath
        run: bundle exec jekyll build --baseurl '/SuLabSMART'
      - name: Validate editable content and generated links
        run: bundle exec ruby scripts/check_content.rb
      - name: Exercise content-only CMS edits
        run: bundle exec ruby scripts/test_cms_editing.rb
