name: build-site
run-name: Build live site

on:
  # called from on-push/on-pages
  workflow_call:

  # run manually by user
  workflow_dispatch:

env:
  PREVIEWS_FOLDER: preview

permissions:
  contents: write

jobs:
  build-site:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout main branch contents
        uses: actions/checkout@v7

      - name: Install Ruby packages
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"
          bundler-cache: true

      - name: Build live version of site
        run: |
          printf "\n\nurl: https://%s.github.io\n" "${GITHUB_REPOSITORY_OWNER}" >> _config.yaml
          repo_name="${GITHUB_REPOSITORY#*/}"
          JEKYLL_ENV=production bundle exec jekyll build --baseurl "/${repo_name}"
          touch _site/.nojekyll

      - name: Commit live site to Pages branch
        uses: JamesIves/github-pages-deploy-action@v4.8.0
        with:
          folder: _site
          clean-exclude: ${{ env.PREVIEWS_FOLDER }}
          force: false
