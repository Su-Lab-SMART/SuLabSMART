proofer: false
defaults:
- scope:
    path: ''
  values:
    layout: default
- scope:
    type: members
  values:
    layout: member
- scope:
    type: posts
  values:
    layout: post
- scope:
    type: pages
  values:
    layout: content-page
collections:
  members:
    output: true
  posts:
    output: true
  research:
    output: false
  publications:
    output: false
  photos:
    output: false
  awards:
    output: false
  pages:
    output: true
    permalink: /pages/:name/
plugins:
- jekyll-spaceship
- jekyll-sitemap
- jekyll-redirect-from
- jekyll-feed
- jekyll-last-modified-at
highlighter: rouge
theme: null
sass:
  sass_dir: _styles
include:
- _styles
- _scripts
exclude:
- README.md
- LICENSE.md
- CITATION.cff
- MIGRATION.md
- migration-assets.json
- EDITOR_GUIDE.md
- scripts
- .pages.yml
jekyll-spaceship:
  mathjax-processor:
    src:
    - https://cdn.jsdelivr.net/npm/mathjax@4/tex-mml-chtml.js
